name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# flux-core 0.87 plus flux-sched add-hold. Override with the
# QUANTUM_FLUX_IMAGE repo variable.
env:
  FLUX_IMAGE: ${{ vars.QUANTUM_FLUX_IMAGE || 'ghcr.io/converged-computing/fluxion-quantum:flux-base-ubuntu-test' }}

jobs:
  # mirrors pre-commit, so CI fails for the same reason a commit would
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install
        run: pip install black flake8
      - name: black
        run: black --check --diff --target-version py312 flux_quantum tests
      - name: flake8 (syntax errors only)
        run: flake8 flux_quantum --select=E9,F63,F7,F82 --show-source
      - name: shellcheck the integration scripts
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          # SC2016 is off because the tests quote QUANTUM_SESSION_ID on
          # purpose. It has to expand inside the job and not in the test shell
          shellcheck -e SC1091,SC2086,SC2016,SC2001 tests/integration/*.sh

  # no flux needed, the flux calls in these paths are injected
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest
      - name: unit tests
        run: pytest tests/unit -q

  # needs a live broker
  integration:
    runs-on: ubuntu-latest
    container:
      image: ${{ vars.QUANTUM_FLUX_IMAGE || 'ghcr.io/converged-computing/fluxion-quantum:flux-base-ubuntu-test' }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      FLUX_QUANTUM_MOCK: 1
    steps:
      - uses: actions/checkout@v4

      - name: install package into flux's python
        run: |
          flux python -m pip install -e . --break-system-packages \
            || flux python -m pip install -e . \
            || pip install -e . --break-system-packages \
            || pip install -e .

      - name: diagnostics
        run: |
          echo "== flux =="; flux version
          echo "== flux python =="; flux python -c "import sys; print(sys.executable)"
          flux python -c "import flux_quantum; print('OK:', flux_quantum.__file__)"

      - name: CLI plugin is discovered
        run: |
          export FLUX_CLI_PLUGINPATH=$PWD/cli-plugins
          flux start flux submit --help 2>&1 | grep -E -- '--quantum-vendor' \
            || { echo "CLI plugin not discovered"; exit 1; }

      - name: vendor backends contribute their own options
        run: |
          export FLUX_CLI_PLUGINPATH=$PWD/cli-plugins
          out=$(flux start flux submit --help 2>&1)
          for opt in --quantum-ibm-backend --quantum-braket-device --quantum-mock-session; do
            echo "$out" | grep -q -- "$opt" || { echo "missing $opt"; exit 1; }
            echo "  $opt OK"
          done

      - name: jobtap plugin builds
        run: make -C flux_quantum/jobtap

      - name: jobtap policy gate (load + accept/reject by vendor)
        run: |
          cat > /tmp/jt.sh <<'SH'
          set -e
          flux jobtap load $GITHUB_WORKSPACE/flux_quantum/jobtap/quantum.so vendors="ibm,braket"
          flux submit --setattr=system.quantum.vendor=ibm -n1 true >/dev/null \
            && echo "ACCEPT-ibm OK"
          if flux submit --setattr=system.quantum.vendor=rigetti -n1 true >/dev/null 2>&1; then
            echo "REJECT-rigetti FAILED"; exit 1
          else echo "REJECT-rigetti OK"; fi
          flux submit -n1 true >/dev/null && echo "ACCEPT-plain OK"
          SH
          flux start bash /tmp/jt.sh

      # one submit gives a held classical and a scout, and the qpu stays
      # allocated until the classical is done
      - name: end-to-end, single broker
        run: flux start bash tests/integration/test-mock-e2e.sh

      # two ranks, so the pair can be placed on different ranks
      - name: end-to-end, two broker ranks
        run: flux start -s2 bash tests/integration/test-mock-e2e.sh

      # vendors discovered from the graph rather than named
      - name: vendor discovery + --quantum-select
        run: flux start bash tests/integration/test-select-discovery.sh

      # this test expects fluxion already loaded, as rc1 does on a real cluster
      - name: system-instance test (fluxion preloaded, 2 ranks)
        run: |
          cat > /tmp/sys.sh <<'SH'
          set -e
          flux module remove -f sched-simple 2>/dev/null || true
          flux module load sched-fluxion-resource match-format=rv1
          flux module load sched-fluxion-qmanager
          export FLUX_CLI_PLUGINPATH=$PWD/cli-plugins
          bash tests/integration/test-system-instance.sh
          SH
          flux start -s2 bash /tmp/sys.sh
